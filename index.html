<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RadEng v3.2 - Tủ sách Tiếng Anh CĐHA &amp; IELTS Academic</title>
  <style>
    :root {
      --primary: #1660A7;
      --primary-dark: #0f467c;
      --primary-light: #e8f1fa;
      --accent: #0F766E;
      --accent-light: #e6f4f1;
      --danger: #C93458;
      --danger-light: #fbe9ee;
      --warning: #b45309;
      --warning-light: #fef3c7;
      --purple: #6d28d9;
      --purple-light: #f3e8ff;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #dce4ef;
      --radius: 12px;
      --shadow: 0 2px 10px rgba(15, 35, 65, 0.06);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    /* Top Header */
    .topbar {
      background: linear-gradient(135deg, #103f70 0%, #1660A7 55%, #0F766E 100%);
      color: #fff;
      padding: 13px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.14);
    }
    .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .brand-badge {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 6px 13px;
      border-radius: 8px;
      font-weight: 800;
      letter-spacing: 0.6px;
      font-size: 16px;
    }
    .brand-title h1 { margin: 0; font-size: 17px; font-weight: 700; }
    .brand-title p { margin: 0; font-size: 12px; opacity: 0.88; }
    .topbar-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      background: #fff;
      color: var(--text);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: #0b5c55; }
    .btn-purple { background: var(--purple); color: #fff; }
    .btn-purple:hover { background: #5b21b6; }
    .btn-warning-outline { background: var(--warning-light); color: var(--warning); border-color: #fcd34d; }
    .btn-danger-outline { background: var(--danger-light); color: var(--danger); border-color: #f3c1cd; }
    .btn-outline { background: #fff; border-color: var(--border); color: var(--text); }
